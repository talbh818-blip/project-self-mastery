<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png?v=3" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Status bar / address bar color. Dark so the system chrome blends
         into the app's dark surface instead of flashing green. -->
    <meta name="theme-color" content="#0d1319" />
    <!-- iOS home-screen icon (Apple ignores PWA manifest icons). -->
    <link rel="apple-touch-icon" href="/logo.png?v=3" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="פרויקט מחויבות לעצמי" />
    <title>פרויקט מחויבות לעצמי</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- ===============================================================
         Emoji CDN — Microsoft Fluent UI Emoji 3D PNGs via jsDelivr.
         Pre-warm the connection and pre-cache the few emojis that appear
         in time-sensitive flows (plant CTA + modal header). Without this
         the 🌍/🌱/🎉 PNGs trickle in 0.5–1s after the button shows up.
         =============================================================== -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="preload"
      as="image"
      href="https://cdn.jsdelivr.net/gh/microsoft/fluentui-emoji@main/assets/Globe%20showing%20europe-africa/3D/globe_showing_europe-africa_3d.png"
      crossorigin
    />
    <link
      rel="preload"
      as="image"
      href="https://cdn.jsdelivr.net/gh/microsoft/fluentui-emoji@main/assets/Seedling/3D/seedling_3d.png"
      crossorigin
    />
    <link
      rel="preload"
      as="image"
      href="https://cdn.jsdelivr.net/gh/microsoft/fluentui-emoji@main/assets/Party%20popper/3D/party_popper_3d.png"
      crossorigin
    />
  </head>
  <body>
    <script>
      // Apply stored theme before React mounts so there's no flash of the
      // wrong palette. Profile-backed theme takes over once it loads.
      (function () {
        try {
          var t = localStorage.getItem('app-theme');
          document.documentElement.setAttribute(
            'data-theme',
            t === 'light' ? 'light' : 'dark',
          );
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
